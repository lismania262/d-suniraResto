<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pemesanan Makanan</title>
</head>
<body>

    <div class="container">
        <h1>Pemesanan Makanan</h1>

        <form id="orderForm">
            <label>Nama Pemesan</label>
            <input type="text" id="nama" required>

            <label>Nomor Meja</label>
            <input type="number" id="meja" required>

            <button type="submit">Mulai Pesan</button>
        </form>
    </div>
<style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #544545, #574343);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            color: #8d7b6f;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            text-align: left;
            font-size: 14px;
            color: #333;
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #8d7b6f;
        }

        /* BUTTON */
        button {
            margin-top: 15px;
            padding: 12px;
            background: #8d7b6f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #745656;
        }
</style>
<script>
document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const nama = document.getElementById("nama").value;
    const meja = document.getElementById("meja").value;

    localStorage.setItem("nama", nama);
    localStorage.setItem("meja", meja);

    window.location.href = "menu.html";
});
</script>
</body>
</html>
