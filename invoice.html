<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice D'Sunira</title>

<style>
body {
  margin: 0;
  font-family: Arial, Georgia,Times, serif;
  background: #F6EFE8;
}

.invoice {
  max-width: 420px;
  margin: 20px auto;
  background: #fff;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 6px 14px rgba(0,0,0,.1);
  color: #5A3E2B;
}

.brand {
  text-align: center;
}

.brand h2 {
  margin: 5px 0;
  color: #C8A27A;
}

.badge {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  background: #C8A27A;
  color: #fff;
  margin-top: 6px;
}

.small {
  font-size: 13px;
  color: #777;
}

.divider {
  border-bottom: 1px dashed #C8A27A;
  margin: 14px 0;
}

.row {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  margin: 6px 0;
}

.total {
  font-size: 16px;
  font-weight: bold;
}

.footer {
  margin-top: 20px;
  text-align: center;
  font-size: 13px;
  color: #777;
}
/* =========================
   PRINT / CETAK INVOICE
   ========================= */
@media print {
  body {
    background: #fff;
  }

  .invoice {
    width: 80mm;
    max-width: 100%;
    margin: 0;
    padding: 0;
    box-shadow: none;
    border-radius: 0;
    color: #000;
  }

  .badge {
    background: #000;
    color: #fff;
  }

  .divider {
    border-bottom: 1px dashed #000;
  }

  .footer {
    color: #000;
  }

  /* sembunyikan elemen yang tidak perlu */
  button,
  .no-print {
    display: none !important;
  }
}

</style>
</head>

<body>

<div class="invoice">

  <div class="brand">
    <h2>D'SUNIRA</h2>
    <div class="small">Invoice</div>
    <div class="badge" id="payBadge"></div>
    <br><br>
    <div class="small">Order time</div>
    <div class="small" id="orderTime"></div>
    <br>
    <div class="table" id="tableText"></div>
</div>

  <div class="divider"></div>

  <div id="items"></div>

  <div class="divider"></div>

  <div class="row">
    <span>Total item(s)</span>
    <span id="subtotal"></span>
  </div>
  <div class="row">
    <span>Service</span>
    <span>0</span>
  </div>
  <div class="row">
    <span>Tax (10%)</span>
    <span id="tax"></span>
  </div>

  <div class="row total">
    <span>GRAND TOTAL</span>
    <span id="grand"></span>
  </div>

  <div class="divider"></div>

  <div id="paymentDetail"></div>

  <div class="no-print" style="text-align:center; margin-top:15px;">
  <button onclick="window.print()"
    style="
      padding:10px 18px;
      border:none;
      border-radius:8px;
      background:#C8A27A;
      color:#fff;
      font-size:14px;
      cursor:pointer;">
    Cetak Invoice
  </button>
</div>

  <div class="footer">
    Terima kasih telah memesan di D'Sunira 🤎<br>
    See You Again!
  </div>

</div>

<script>
// DATA
const cart = JSON.parse(localStorage.getItem("keranjang")) || [];
const metode = localStorage.getItem("metodeBayar") || "Cash";
const meja = localStorage.getItem("meja") || "-";
document.getElementById("tableText").innerText = "TABLE " + meja;

let subtotal = 0;
const items = document.getElementById("items");

// ITEM LIST
cart.forEach(i => {
  const total = i.harga * i.qty;
  subtotal += total;

  items.innerHTML += `
    <div class="row">
      <span>${i.qty} ${i.nama}</span>
      <span>${total.toLocaleString("id-ID")}</span>
    </div>
  `;
});

const tax = subtotal * 0.1;
const grand = subtotal + tax;

// TOTAL
document.getElementById("subtotal").innerText = subtotal.toLocaleString("id-ID");
document.getElementById("tax").innerText = tax.toLocaleString("id-ID");
document.getElementById("grand").innerText = grand.toLocaleString("id-ID");

// WAKTU
document.getElementById("orderTime").innerText =
  new Date().toLocaleString("id-ID");

// METODE BAYAR BADGE
document.getElementById("payBadge").innerText = metode.toUpperCase();

// DETAIL PEMBAYARAN BERBEDA
const payBox = document.getElementById("paymentDetail");

if (metode === "Cash") {
  payBox.innerHTML = `
    <div class="row">
      <span>Payment Method</span>
      <span>Cash</span>
    </div>
    <div class="row">
      <span>Status</span>
      <span>Pay at cashier</span>
    </div>
  `;
}

if (metode === "QRIS") {
  payBox.innerHTML = `
    <div class="row">
      <span>Payment Method</span>
      <span>QRIS</span>
    </div>
    <div class="row">
      <span>Status</span>
      <span>Paid</span>
    </div>
    <div class="row">
      <span>Payment Ref</span>
      <span>QR-${Math.random().toString(36).substr(2,8).toUpperCase()}</span>
    </div>
  `;
}

if (metode === "Debit") {
  payBox.innerHTML = `
    <div class="row">
      <span>Payment Method</span>
      <span>Debit Card</span>
    </div>
    <div class="row">
      <span>Status</span>
      <span>Paid</span>
    </div>
    <div class="row">
      <span>Card</span>
      <span>**** **** **** 1234</span>
    </div>
    <div class="row">
      <span>Approval Code</span>
      <span>${Math.floor(Math.random()*999999)}</span>
    </div>
  `;
}
</script>

</body>
</html>
